name: Build Raylib 6.0 Windows (GCC 9.3 SJLJ)

on:
  push:
    tags: ['v*', 'raylib-*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  RAYLIB_VERSION: "6.0"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86
            msystem: MINGW32
            mingw_arch: i686
            toolchain_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/9.3.0-7.0.0-sjlj-r3/winlibs-mingw-w64-i686-9.3.0-7.0.0-r3-sjlj.7z
            cmake_generator: "MinGW Makefiles"
            artifact_name: raylib-6.0-win32-static-gcc93-sjlj
            extra_flags: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32"
            gcc_prefix: i686-w64-mingw32
          - arch: x64
            msystem: MINGW64
            mingw_arch: x86_64
            toolchain_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/9.3.0-7.0.0-sjlj-r3/winlibs-mingw-w64-x86_64-9.3.0-7.0.0-r3-sjlj.7z
            cmake_generator: "MinGW Makefiles"
            artifact_name: raylib-6.0-win64-static-gcc93-sjlj
            extra_flags: ""
            gcc_prefix: x86_64-w64-mingw32

    name: Build ${{ matrix.arch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup winlibs Toolchain
        shell: pwsh
        id: setup_toolchain
        run: |
          $url = "${{ matrix.toolchain_url }}"
          Write-Host "Downloading toolchain from: $url"
          $toolchainDir = "C:\winlibs"
          New-Item -ItemType Directory -Force -Path $toolchainDir | Out-Null
          
          Invoke-WebRequest -Uri $url -OutFile toolchain.7z
          7z x toolchain.7z -o"$toolchainDir" -y
          
          $mingwDir = if ("${{ matrix.arch }}" -eq "x86") { "mingw32" } else { "mingw64" }
          $gccPrefix = if ("${{ matrix.arch }}" -eq "x86") { "i686-w64-mingw32" } else { "x86_64-w64-mingw32" }
          $gccExe = Join-Path $toolchainDir "$mingwDir\bin\$gccPrefix-gcc.exe"
          
          if (-not (Test-Path $gccExe)) {
            Write-Error "GCC not found at expected path: $gccExe"
            exit 1
          }
          
          $binPath = Join-Path $toolchainDir "$mingwDir\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Add-Content -Path $env:GITHUB_OUTPUT -Value "winlibs_path=$binPath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "gcc_prefix=$gccPrefix"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            make
            mingw-w64-${{ matrix.mingw_arch }}-cmake
            mingw-w64-${{ matrix.mingw_arch }}-ninja

      - name: Download Raylib Source
        shell: msys2 {0}
        run: |
          # 下载 Raylib 源码 (如果 6.0 尚未发布，请将 6.0 改为 5.5 或 master)
          curl -L -o raylib.tar.gz "https://github.com/raysan5/raylib/archive/refs/tags/${{ env.RAYLIB_VERSION }}.tar.gz"
          tar -xzf raylib.tar.gz
          ls -la

      - name: Configure Raylib
        shell: msys2 {0}
        env:
          WINLIBS_BIN: ${{ steps.setup_toolchain.outputs.winlibs_path }}
          GCC_PREFIX: ${{ steps.setup_toolchain.outputs.gcc_prefix }}
        run: |
          WINLIBS_MSYS=$(cygpath -u "$WINLIBS_BIN")
          export PATH="$WINLIBS_MSYS:$PATH"
          
          # 查找源码目录 (通常是 raylib-6.0)
          SRC_DIR=$(find . -maxdepth 1 -type d -name "raylib-*" | head -1)
          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: Could not find Raylib source directory"
            ls -la
            exit 1
          fi
          echo "Source directory: $SRC_DIR"
          
          mkdir -p build && cd build
          
          # Raylib CMake 配置
          cmake ../$SRC_DIR \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${GCC_PREFIX}-gcc" \
            -DCMAKE_CXX_COMPILER="${GCC_PREFIX}-g++" \
            -DCMAKE_RC_COMPILER="${GCC_PREFIX}-windres" \
            -DCMAKE_INSTALL_PREFIX=/raylib-${{ matrix.arch }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DRAYLIB_BUILD_EXAMPLES=OFF \
            -DRAYLIB_BUILD_GAMES=OFF \
            -DRAYLIB_BUILD_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            ${{ matrix.extra_flags }}

      - name: Build Raylib
        shell: msys2 {0}
        env:
          WINLIBS_BIN: ${{ steps.setup_toolchain.outputs.winlibs_path }}
          GCC_PREFIX: ${{ steps.setup_toolchain.outputs.gcc_prefix }}
        run: |
          WINLIBS_MSYS=$(cygpath -u "$WINLIBS_BIN")
          export PATH="$WINLIBS_MSYS:$PATH"
          
          cd build
          mingw32-make -j$(nproc) VERBOSE=1

      - name: Install Raylib
        shell: msys2 {0}
        env:
          WINLIBS_BIN: ${{ steps.setup_toolchain.outputs.winlibs_path }}
        run: |
          WINLIBS_MSYS=$(cygpath -u "$WINLIBS_BIN")
          export PATH="$WINLIBS_MSYS:$PATH"
          
          cd build
          mingw32-make install DESTDIR=/ 2>&1 | tee install.log || true
          
          echo "=== Installation Results ==="
          if [ -d "/raylib-${{ matrix.arch }}/lib" ]; then
            ls -lh "/raylib-${{ matrix.arch }}/lib/"
          fi

      - name: Package Artifacts
        shell: pwsh
        run: |
          $pkgName = "${{ matrix.artifact_name }}"
          $arch = "${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "$pkgName\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgName\include" | Out-Null
          
          $installPath = "C:\msys64\raylib-$arch"
          
          # 收集库文件
          if (Test-Path "$installPath\lib") {
            Get-ChildItem -Path "$installPath\lib" -Recurse -Include "*.a","*.lib" | ForEach-Object {
              Copy-Item $_.FullName -Destination "$pkgName\lib\" -Force
            }
          }
          
          # 收集头文件 (优先使用 install 后的 include 目录)
          $includePath = Join-Path $installPath "include"
          if (Test-Path $includePath) {
            Copy-Item "$includePath\*" -Destination "$pkgName\include\" -Recurse -Force
          } else {
            # Fallback: 从源码目录复制
            $srcDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "raylib-*" } | Select-Object -First 1
            if ($srcDir) {
              Copy-Item "$($srcDir.FullName)\src\*.h" -Destination "$pkgName\include\" -Force -ErrorAction SilentlyContinue
            }
          }
          
          # 生成构建信息
          $buildInfo = "Raylib ${{ env.RAYLIB_VERSION }} $arch Static Library`n" +
                       "Compiler: MinGW-w64 GCC 9.3.0 (SJLJ Exception Model)`n" +
                       "Toolchain: winlibs 9.3.0-7.0.0-r3`n" +
                       "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`n" +
                       "Architecture: $arch`n" +
                       "Generator: ${{ matrix.cmake_generator }}"
          $buildInfo | Out-File -Encoding utf8 -FilePath "$pkgName\BUILD_INFO.txt"
          
          # 压缩打包
          7z a "${pkgName}.7z" "$pkgName\" -mx=9
          Compress-Archive -Path "$pkgName" -DestinationPath "${pkgName}.zip" -CompressionLevel Optimal

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.7z

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Tag for Manual Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        shell: bash
        run: |
          TAG_NAME="raylib-build-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: raylib-6.0-*-gcc93-sjlj
          merge-multiple: true

      - name: Generate Checksums
        shell: pwsh
        id: checksums
        run: |
          $checksumFile = "CHECKSUMS.txt"
          Get-ChildItem -Path "./artifacts" -Recurse -Include "*.zip","*.7z" | 
            Get-FileHash -Algorithm SHA256 | 
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | 
            Out-File -Encoding utf8 $checksumFile
          $content = (Get-Content $checksumFile -Raw).Trim()
          "content<<EOF`n$content`nEOF" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          name: Raylib ${{ env.RAYLIB_VERSION }} Windows (GCC 9.3 SJLJ) ${{ env.RELEASE_TAG || github.ref_name }}
          body: |
            ## Raylib ${{ env.RAYLIB_VERSION }} Windows 静态库 (GCC 9.3 SJLJ)
            ${{ github.event_name == 'workflow_dispatch' && '**手动触发构建**' || '' }}
            
            ### 编译器信息
            - **版本**: MinGW-w64 GCC 9.3.0 (winlibs 9.3.0-7.0.0-r3)
            - **异常处理**: SJLJ (SetJump/LongJump)
            - **架构**: x86 / x64
            - **构建类型**: 纯静态库 (`.a`)，包含头文件
            
            ### SHA256 校验和
            ```
            ${{ steps.checksums.outputs.content }}
            ```
          files: |
            artifacts/**/*.zip
            artifacts/**/*.7z
            CHECKSUMS.txt
          draft: false
